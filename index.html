<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="dino.js"></script>
        <script type="module">
            import Game from './dino.js'
            function runGame() {
                var game = new Game()
                game.run()
            }
            document.addEventListener('DOMContentLoaded',runGame)
        </script>
</head>
<body>
    

<h1>My Canvas Example</h1>

<!-- 1. The <canvas> element is defined here -->
<canvas id="game" width="800" height="600" style="border:1px solid #000000;"></canvas>


</body>
</html>
